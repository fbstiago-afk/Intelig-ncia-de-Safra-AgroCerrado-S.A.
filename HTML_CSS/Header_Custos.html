<!-- HTML Header Custos — template legível. Trechos «...» são expressões DAX concatenadas na medida [HTML Header Custos]. -->
<style>*{box-sizing:border-box;margin:0;padding:0}

html,body{background:transparent;overflow:hidden;font-family:'Open Sans','Segoe UI',sans-serif;color:#333}

#htmlViewer{overflow:hidden !important}

.os-scrollbar,.os-scrollbar-vertical,.os-scrollbar-horizontal{display:none !important}

.mont{font-family:'Montserrat','Segoe UI Semibold','Segoe UI',sans-serif}

@keyframes fu{from{opacity:0;transform:translateY(14px)}
to{opacity:1;transform:none}
}

@keyframes gw{from{width:0}
}

@keyframes dr{from{stroke-dashoffset:100}
to{stroke-dashoffset:0}
}

@keyframes sh{0%{background-position:-200% 0}
100%{background-position:200% 0}
}

.hd{position:absolute;inset:0;border-radius:16px;overflow:hidden;background:linear-gradient(100deg,#0E2A12 0%,#1B5E20 52%,#2E7D32 100%);box-shadow:0 10px 26px rgba(14,42,18,.28);animation:fd .8s cubic-bezier(.2,.7,.2,1) both}

.hd:after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#C9A227,#F3D77A,#C9A227,transparent);background-size:200% 100%;animation:sh 6s linear infinite}

@keyframes fd{from{opacity:0;transform:translateY(-12px)}
to{opacity:1;transform:none}
}

.br{position:absolute;left:1.0%;width:21.0%;top:0;bottom:0;display:flex;align-items:center;gap:10px}

.lg{width:40px;height:40px;flex:none;background:rgba(255,255,255,.96);border-radius:50%;padding:3px;box-shadow:0 0 0 2px rgba(201,162,39,.55)}

.bn{font-family:'Montserrat','Segoe UI Semibold','Segoe UI',sans-serif;font-weight:800;color:#fff;font-size:16px;letter-spacing:.01em;line-height:1}

.bn span{color:#C9A227;font-size:11px;margin-left:3px;letter-spacing:.2em}

.bs{font-size:9px;letter-spacing:.24em;color:#BFD8BA;margin-top:5px;font-weight:600}

.pl{position:absolute;top:22.0%;height:56.0%;border-radius:40px;display:flex;align-items:center;justify-content:center;color:#E6F0E3;font-size:12px;font-weight:600;letter-spacing:.02em;border:1px solid rgba(255,255,255,.18);transition:all .3s}

.pl.on{background:#fff;color:#1B5E20;border-color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}

.pl.on:before{content:'';width:6px;height:6px;border-radius:50%;background:#C9A227;margin-right:8px;box-shadow:0 0 0 3px rgba(201,162,39,.25)}

.cx{position:absolute;left:75.0%;width:14.5%;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;border-left:1px solid rgba(255,255,255,.18);padding-left:12px}

.cx b{color:#fff;font-size:11.5px;font-weight:700}
.cx i{font-style:normal;color:#BFD8BA;font-size:9.5px;margin-top:3px}

.fl{position:absolute;left:90.5%;width:8.5%;top:22.0%;height:56.0%;border-radius:40px;background:linear-gradient(135deg,#E3C25B,#C9A227);color:#1B3A12;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:12px;box-shadow:0 4px 14px rgba(201,162,39,.4)}

.fl em{font-style:normal;background:#1B5E20;color:#fff;border-radius:10px;font-size:9.5px;padding:1px 6px}

.pg{position:absolute;right:0;top:0}
</style>
