<!-- HTML Capa Manifesto — template legível. Trechos «...» são expressões DAX concatenadas na medida [HTML Capa Manifesto]. -->
<style>*{box-sizing:border-box;margin:0;padding:0}

html,body{background:transparent;overflow:hidden;font-family:'Open Sans','Segoe UI',sans-serif;color:#333}

#htmlViewer{overflow:hidden !important}

.os-scrollbar,.os-scrollbar-vertical,.os-scrollbar-horizontal{display:none !important}

.mont{font-family:'Montserrat','Segoe UI Semibold','Segoe UI',sans-serif}

@keyframes fu{from{opacity:0;transform:translateY(14px)}
to{opacity:1;transform:none}
}

@keyframes gw{from{width:0}
}

@keyframes dr{from{stroke-dashoffset:100}
to{stroke-dashoffset:0}
}

@keyframes sh{0%{background-position:-200% 0}
100%{background-position:200% 0}
}

.tg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fu 1.4s .6s both}

.tg b{font-family:'Montserrat','Segoe UI Semibold','Segoe UI',sans-serif;font-style:italic;font-weight:600;color:#fff;font-size:15px;text-shadow:0 2px 10px rgba(0,0,0,.55)}

.tg span{margin-top:7px;font-size:10px;letter-spacing:.32em;color:#F3D77A;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.6)}
</style>
<div class='tg'><b>“Cultivar o futuro do Cerrado com excelência e responsabilidade.”</b><span>INTELIGÊNCIA DE SAFRA · 10 FAZENDAS · 5 ESTADOS · 2024–2026</span></div>
