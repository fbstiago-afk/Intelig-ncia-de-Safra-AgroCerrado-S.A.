<!-- HTML Capa Pulso — template legível. Trechos «...» são expressões DAX concatenadas na medida [HTML Capa Pulso]. -->
<style>*{box-sizing:border-box;margin:0;padding:0}

html,body{background:transparent;overflow:hidden;font-family:'Open Sans','Segoe UI',sans-serif;color:#333}

#htmlViewer{overflow:hidden !important}

.os-scrollbar,.os-scrollbar-vertical,.os-scrollbar-horizontal{display:none !important}

.mont{font-family:'Montserrat','Segoe UI Semibold','Segoe UI',sans-serif}

@keyframes fu{from{opacity:0;transform:translateY(14px)}
to{opacity:1;transform:none}
}

@keyframes gw{from{width:0}
}

@keyframes dr{from{stroke-dashoffset:100}
to{stroke-dashoffset:0}
}

@keyframes sh{0%{background-position:-200% 0}
100%{background-position:200% 0}
}

.rg{position:absolute;left:20px;top:14px;width:246px;height:62px;border-radius:40px;border:2px solid rgba(243,215,122,.95);animation:pu 2.6s cubic-bezier(.2,.7,.2,1) infinite}

.rg.b{animation-delay:1.3s}

@keyframes pu{0%{transform:scale(1);opacity:.9}
100%{transform:scale(1.16,1.45);opacity:0}
}
</style>
<div class='rg'></div>
<div class='rg b'></div>
